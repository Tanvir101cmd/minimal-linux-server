# =======================
# DEBIAN-SPECIFIC TASKS
# =======================
- name: Ensuring libpam-tmpdir is installed for PAM session isolation [AUTH-9262]
  ansible.builtin.apt:
    name: libpam-tmpdir
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
  tags: lynis

- name: Ensuring apt-listchanges is installed for change tracking [PKGS-7388]
  ansible.builtin.apt:
    name: apt-listchanges
    state: present
  when: ansible_facts['os_family'] == "Debian"
  tags: lynis

- name: Ensuring auditd is installed
  ansible.builtin.package:
    name: "{{ linux_baseline_audit_package }}"
    state: present
  tags: lynis

- name: Configure apt-listchanges for non-interactive automation
  ansible.builtin.debconf:
    name: apt-listchanges
    question: apt-listchanges/confirm
    value: "false"
    vtype: select
  when: ansible_facts['os_family'] == "Debian"
  tags: lynis

# ==================
# UNIVERSAL TASKS
# ==================

- name: Ensuring Fail2ban is installed
  ansible.builtin.package:
    name: fail2ban
    state: present
  tags: lynis

- name: Copy Fail2ban jail.conf to jail.local to protect configuration override [TOOL-5102]
  ansible.builtin.copy:
    src: /etc/fail2ban/jail.conf
    dest: /etc/fail2ban/jail.local
    remote_src: true
    force: false
    mode: "0644"
  tags: lynis

- name: Restrict system crontab permission [FILE-7524]
  ansible.builtin.file:
    path: /etc/crontab
    state: touch
    mode: "0600"
    owner: root
    group: root
    modification_time: preserve
    access_time: preserve
  tags: lynis

# ==================
# KERNEL PARAMETERS
# ==================

- name: Applying kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-custom.conf
    state: present
    reload: true
  loop:
      # Network: IPv4
    - { name: net.ipv4.tcp_syncookies, value: 1 }
    - { name: net.ipv4.conf.all.rp_filter, value: 1 }
    - { name: net.ipv4.conf.default.rp_filter, value: 1 }
    - { name: net.ipv4.conf.all.accept_redirects, value: 0 }
    - { name: net.ipv4.conf.default.accept_redirects, value: 0 }
    - { name: net.ipv4.conf.all.send_redirects, value: 0 }
    - { name: net.ipv4.conf.default.send_redirects, value: 0 }
    - { name: net.ipv4.conf.all.accept_source_route, value: 0 }
    - { name: net.ipv4.conf.default.accept_source_route, value: 0 }
    - { name: net.ipv4.conf.all.log_martians, value: 1 }
    - { name: net.ipv4.conf.default.log_martians, value: 1 }
    - { name: net.ipv4.icmp_echo_ignore_broadcasts, value: 1 }
    # Network: IPv6
    - { name: net.ipv6.conf.all.accept_redirects, value: 0 }
    - { name: net.ipv6.conf.default.accept_redirects, value: 0 }
    # Kernel
    - { name: kernel.randomize_va_space, value: 2 }
    - { name: kernel.sysrq, value: 0 }
    - { name: kernel.core_uses_pid, value: 1 }
    - { name: kernel.dmesg_restrict, value: 1 }
    - { name: kernel.kptr_restrict, value: 2 }
    - { name: kernel.yama.ptrace_scope, value: 1 }
    # Filesystem
    - { name: fs.protected_hardlinks, value: 1 }
    - { name: fs.protected_symlinks, value: 1 }
    - { name: fs.suid_dumpable, value: 0 }
  tags: lynis
