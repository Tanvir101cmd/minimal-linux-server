- name: Checking if tailscale is installed
  ansible.builtin.command: which tailscale
  register: linux_baseline_tailscale_check
  failed_when: false
  changed_when: false
  tags: tailscale

- name: Download Tailscale installer script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install.sh
    mode: '0755'
  when: linux_baseline_tailscale_check.rc != 0
  tags: tailscale

- name: Ensuring tailscale and up and running
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  when: lookup('env', 'GITHUB_ACTIONS') != 'true'
  tags: tailscale

- name: Execute Tailscale installer script
  ansible.builtin.command: /tmp/install.sh
  when: linux_baseline_tailscale_check.rc != 0
  changed_when: true
  tags: tailscale
