---
# 1. Check if Tailscale is installed (Runs on ALL distros, ensures variable is always defined)
- name: Check if tailscale is installed
  ansible.builtin.command: which tailscale
  register: linux_baseline_tailscale_check
  failed_when: false
  changed_when: false
  tags: tailscale

# 2. RedHat: Install via native package manager (Since it's in the rocky dnf repo!)
- name: Install Tailscale via package manager (RedHat)
  ansible.builtin.package:
    name: tailscale
    state: present
  when:
    - ansible_facts['os_family'] == "RedHat"
    - linux_baseline_tailscale_check.rc != 0
    - lookup('env', 'GITHUB_ACTIONS') != 'true'
  tags: tailscale

# 3. Debian: Download and run script (Since it's not in default apt repos)
- name: Download Tailscale installer script (Debian)
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install.sh
    mode: "0755"
  when:
    - ansible_facts['os_family'] == "Debian"
    - linux_baseline_tailscale_check.rc != 0
    - lookup('env', 'GITHUB_ACTIONS') != 'true'
  register: linux_baseline_tailscale_download
  tags: tailscale

- name: Execute Tailscale installer script (Debian)
  ansible.builtin.command: /tmp/install.sh
  when:
    - ansible_facts['os_family'] == "Debian"
    - linux_baseline_tailscale_check.rc != 0
    - lookup('env', 'GITHUB_ACTIONS') != 'true'
  changed_when: true
  register: linux_baseline_tailscale_install
  failed_when:
    - linux_baseline_tailscale_install.rc != 0
    - "'already installed' not in linux_baseline_tailscale_install.stdout"
  tags: tailscale

# 4. Universal: Start the service on both distros
- name: Ensuring tailscaled is up and running
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  when: lookup('env', 'GITHUB_ACTIONS') != 'true'
  failed_when: false
  tags: tailscale

- name: Tailscale skipped in CI env
  ansible.builtin.debug:
    msg: "Tailscale installation skipped in Github CI"
  when: lookup('env', 'GITHUB_ACTIONS') == 'true'
  tags: tailscale
