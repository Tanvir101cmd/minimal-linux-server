---
# 1. Check if Tailscale is already installed (universal)
- name: Check if tailscale is installed
  ansible.builtin.command: which tailscale
  register: linux_baseline_tailscale_check
  failed_when: false
  changed_when: false
  tags: tailscale

# 2. Download Tailscale installer script (universal)
- name: Download Tailscale installer script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install.sh
    mode: "0755"
  when:
    - linux_baseline_tailscale_check.rc != 0
    - lookup('env', 'GITHUB_ACTIONS') != 'true'
  tags: tailscale

# 3. Execute Tailscale installer script (universal)
- name: Execute Tailscale installer script
  ansible.builtin.command: /tmp/install.sh
  when:
    - linux_baseline_tailscale_check.rc != 0
    - lookup('env', 'GITHUB_ACTIONS') != 'true'
  changed_when: true
  register: linux_baseline_tailscale_install
  failed_when:
    - linux_baseline_tailscale_install.rc != 0
    - "'already installed' not in linux_baseline_tailscale_install.stdout"
  tags: tailscale

# 4. Universal: Start and enable the service on both distros
- name: Ensuring tailscaled is up and running
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  when: lookup('env', 'GITHUB_ACTIONS') != 'true'
  failed_when: false
  tags: tailscale

- name: Tailscale skipped in CI env
  ansible.builtin.debug:
    msg: "Tailscale installation skipped in Github CI"
  when: lookup('env', 'GITHUB_ACTIONS') == 'true'
  tags: tailscale
