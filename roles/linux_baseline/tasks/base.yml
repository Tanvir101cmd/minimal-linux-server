---
- name: Update package cache & upgrade all packages (Debian)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Update package cache & upgrade all packages (RedHat)
  ansible.builtin.dnf:
    name: '*'
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Install baseline pkgs
  ansible.builtin.apt:
    name: "{{ linux_baseline_packages }}"
    state: present
    update_cache: true
  tags: packages
