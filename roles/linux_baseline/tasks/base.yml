---
- name: Update package cache & upgrade all packages (Debian)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Upgrade all packages (RedHat)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
    update_only: true  # noqa package-latest
  when: ansible_facts['os_family'] == "RedHat"

- name: Install EPEL repo (Required for fail2ban on RHEL)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Install baseline pkgs
  ansible.builtin.package:
    name: "{{ linux_baseline_packages }}"
    state: present
    update_cache: true
  tags: packages
