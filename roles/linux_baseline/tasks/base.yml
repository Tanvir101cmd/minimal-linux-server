---
- name: Update package cache & upgrade all packages (Debian)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Upgrade all packages (RedHat)
  ansible.builtin.command:
    cmd: dnf -y upgrade
  register: linux_baseline_dnf_upgrade
  changed_when: "'Nothing to do' not in linux_baseline_dnf_upgrade.stdout"
  when: ansible_facts['os_family'] == "RedHat"

- name: Install baseline pkgs
  ansible.builtin.package:
    name: "{{ linux_baseline_packages }}"
    state: present
    update_cache: true
  tags: packages
