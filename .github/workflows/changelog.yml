name: Update Changelog Daily

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Subcategorized Changelog Generator
        run: python generate-changelog.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-action[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update changelog [skip ci]" && git push)
