- name: Automate minimal + hardened ubuntu server
  hosts: all
  become: true
  become_method: sudo

  vars_files:
    - vars/config.yml

  tasks:
    - import_tasks: tasks/base.yml
    - import_tasks: tasks/security.yml
    - import_tasks: tasks/ssh.yml
    - import_tasks: tasks/system.yml

  handlers:
    - import_tasks: handlers/main.yml
        